<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="面向 AI 产品经理实习候选人的个性化文本面试陪练。">
  <title>AI 面试陪练｜张睿阳</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="ai-interview.css?v=20260907-2">
</head>
<body>
  <div class="app-shell">
    <aside class="side-panel">
      <a class="back-link" href="index.html#projects">← 返回作品集</a>
      <div class="brand-mark" aria-label="AI 面试陪练">
        <span class="brand-icon">AI</span>
        <div><strong>面试陪练</strong><small>INTERVIEW LAB</small></div>
      </div>
      <nav class="step-list" aria-label="面试流程">
        <button class="step-item is-active" type="button" data-step="setup" aria-current="step">
          <span>01</span><div><strong>准备资料</strong><small>简历与目标岗位</small></div>
        </button>
        <button class="step-item" type="button" data-step="analysis" disabled>
          <span>02</span><div><strong>匹配分析</strong><small>能力与证据缺口</small></div>
        </button>
        <button class="step-item" type="button" data-step="interview" disabled>
          <span>03</span><div><strong>模拟面试</strong><small>5 道针对性问题</small></div>
        </button>
        <button class="step-item" type="button" data-step="report" disabled>
          <span>04</span><div><strong>能力报告</strong><small>证据与改进任务</small></div>
        </button>
      </nav>
      <div class="privacy-note"><i></i><p>输入会发送给模型完成分析；本项目服务端不持久化保存简历和回答。</p></div>
    </aside>

    <main class="workspace">
      <header class="topbar">
        <span class="mode-pill" id="apiStatus"><i></i> 正在检查模型连接</span>
        <span class="session-meta">AI 产品经理实习 · 约 20 分钟</span>
      </header>

      <section class="view is-visible" id="setupView" aria-labelledby="setupTitle">
        <div class="view-heading">
          <p>01 / INPUT</p>
          <h1 id="setupTitle">先让问题真正<br>与你有关。</h1>
          <span>提交简历与 JD 后，系统会先找证据，再生成问题。</span>
        </div>

        <div class="input-grid">
          <section class="input-card">
            <div class="card-heading"><span>简历</span><small>PDF 或文本</small></div>
            <label class="file-drop" for="resumeFile">
              <input id="resumeFile" type="file" accept=".pdf,application/pdf">
              <span class="drop-icon">↥</span>
              <strong>上传 PDF 简历</strong>
              <small id="fileStatus">或在下方粘贴简历文本</small>
            </label>
            <label class="field-label" for="resumeText">简历文本</label>
            <textarea id="resumeText" rows="7" placeholder="粘贴教育、实习和项目经历……"></textarea>
          </section>

          <section class="input-card">
            <div class="card-heading"><span>目标岗位</span><small>JD 文本</small></div>
            <label class="field-label" for="jdText">岗位描述</label>
            <textarea id="jdText" rows="13" placeholder="粘贴岗位职责与任职要求……"></textarea>
          </section>
        </div>

        <div class="setup-actions">
          <button class="text-button" id="loadSample" type="button">载入项目测试样本</button>
          <button class="primary-button" id="analyzeButton" type="button">分析匹配关系 <span>→</span></button>
        </div>
        <p class="form-error" id="formError" role="alert"></p>
      </section>

      <section class="view" id="analysisView" aria-labelledby="analysisTitle"></section>
      <section class="view" id="interviewView" aria-labelledby="interviewTitle"></section>
      <section class="view" id="reportView" aria-labelledby="reportTitle"></section>
    </main>
  </div>
  <script src="ai-interview.js?v=20260907-2"></script>
</body>
</html>
